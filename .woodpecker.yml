when:
  event: manual

steps:
  - name: test-and-package
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/maven:3.9.9-eclipse-temurin-17
    commands:
      - mvn -f complete/pom.xml -B clean package
      - mkdir -p "/root/Packages/gs-rest-service/${CI_COMMIT_SHA}"; test -n "$(find complete/target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-plain.jar' -print -quit)"; cp "$(find complete/target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-plain.jar' -print -quit)" "/root/Packages/gs-rest-service/${CI_COMMIT_SHA}/application.jar"; sha256sum "/root/Packages/gs-rest-service/${CI_COMMIT_SHA}/application.jar" > "/root/Packages/gs-rest-service/${CI_COMMIT_SHA}/application.jar.sha256"; printf '{"app":"gs-rest-service","commit":"%s","artifact":"application.jar"}' "${CI_COMMIT_SHA}" > "/root/Packages/gs-rest-service/${CI_COMMIT_SHA}/artifact-manifest.json"
